# Runs the test suite on GitHub's servers for every push and pull request.
name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip              # reuse downloaded packages between runs (faster)

      - name: Install requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint with ruff
        run: ruff check .

      - name: Run tests
        env:
          # a throwaway salt for the PII hashing tests (real salts never go in the repo)
          GATEKEEPER_PII_SALT: ci-only-not-secret
        run: pytest -q
