# Tool settings for this project (the code itself is run as scripts, not installed as a package).

[tool.ruff]
line-length = 100
target-version = "py39"          # our local venv is Python 3.9; CI uses 3.11
extend-exclude = ["results", "data"]

[tool.ruff.lint]
# E/W = style errors and warnings (pycodestyle), F = real mistakes (pyflakes:
# unused imports, undefined names), I = sorted imports, B = likely bugs (bugbear),
# UP = old syntax that has a newer form
select = ["E", "W", "F", "I", "B", "UP", "ANN"]
# ANN = every function needs type hints. Any is allowed (e.g. JSON helpers).
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
# tests and one-off scripts do not need type hints
"tests/**" = ["ANN"]
"scripts/**" = ["ANN"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI declares upload fields as `file: UploadFile = File(...)` — that is the
# official pattern, not the "mutable default argument" bug B008 looks for.
extend-immutable-calls = ["fastapi.File"]

[tool.ruff.lint.isort]
known-first-party = ["src"]
