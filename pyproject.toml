# Project info + tool settings. The code is run as scripts, not installed as a package;
# requirements.txt is what `make install` and CI use, and lists the same libraries.

[project]
name = "data-gatekeeper"
version = "1.5.0"
description = "Profile, clean, transform and protect tabular data before ML"
requires-python = ">=3.9"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "matplotlib>=3.7",
    "scikit-learn>=1.3",
    "joblib>=1.3",
    "pyyaml>=6.0",
    "jsonschema>=4.0",
    "rapidfuzz>=3.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "httpx>=0.27", "ruff>=0.5"]

[tool.ruff]
line-length = 100
target-version = "py39"          # our local venv is Python 3.9; CI uses 3.11
extend-exclude = ["results", "data"]

[tool.ruff.lint]
# E/W = style errors and warnings (pycodestyle), F = real mistakes (pyflakes:
# unused imports, undefined names), I = sorted imports, B = likely bugs (bugbear),
# UP = old syntax that has a newer form
select = ["E", "W", "F", "I", "B", "UP", "ANN", "D103"]
# ANN = every function needs type hints. Any is allowed (e.g. JSON helpers).
# D103 = every public function needs a docstring.
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
# tests and one-off scripts do not need type hints
"tests/**" = ["ANN", "D103"]
"scripts/**" = ["ANN"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI declares upload fields as `file: UploadFile = File(...)` (and query
# parameters as `Query(...)`) — that is the official pattern, not the "mutable default
# argument" bug B008 looks for.
extend-immutable-calls = ["fastapi.File", "fastapi.Query"]

[tool.ruff.lint.isort]
known-first-party = ["src"]
