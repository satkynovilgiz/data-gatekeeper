# One-command pipeline for the Bank Marketing data:  python gatekeeper.py run --config pipeline.yaml
# Steps run in this order (any subset): profile -> validate -> clean -> mask_pii -> quality
# -> drift -> impact. The contract gate stops the run on an error-level failure (exit 1).
# Paths are relative to where you run the command. Results: reports/run_<UTC time>/.
# Before the first run:  python scripts/download_bank_marketing.py
#                        python scripts/make_drift_demo.py     (the drift reference)
input: data/raw/bank_marketing.csv
name: bank_marketing
reports_dir: reports
steps:
  - profile
  - validate:
      contract: contracts/bank_marketing.yaml
  - clean:
      imputer: iterative          # chosen in Sprint 5 (median is ~4x faster)
  - mask_pii                      # Bank has no personal data: reports 0 columns
  - quality
  - drift:
      reference: data/demo/bank_reference.csv
      contract: contracts/bank_marketing.yaml   # thresholds + column types
      gate: false                 # true: major drift stops the run (exit 1)
  - impact:                       # heavy (minutes): skip with --skip impact
      target: y
      folds: 5
      robustness: true
